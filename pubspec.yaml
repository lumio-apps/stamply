name: stamply
description: Stamply – Visa Checker. Offline visa requirements for 199 passports.
publish_to: "none"
version: 0.15.0+17

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ">=1.2.0 <2.0.0"
  open_filex: ">=4.5.0 <5.0.0"
  package_info_plus: ">=8.0.0 <11.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.14.0 <0.15.0"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/visa_data.json
    - assets/data/country_names.json
    - assets/data/world_map.json
    - assets/data/country_facts.json
    - assets/data/LICENSE-countries.txt
    - assets/data/LICENSE-data.txt
    - assets/data/LICENSE-cldr.txt
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-IBMPlexSans.txt

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
