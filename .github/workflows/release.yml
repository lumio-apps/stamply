name: Release

# Runs when you push a tag like v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # Recreate the Lumio release key from repository secrets.
      # Required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      # 1) GitHub APK: includes the in-app "Check for updates".
      - name: Build GitHub APK
        run: flutter build apk --release

      - name: Sign GitHub APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Stamply-${{ github.ref_name }}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "Stamply-${{ github.ref_name }}.apk"

      # 2) Google Play bundle: no in-app updater. Internet stays for "Update data".
      - name: Build Play Store bundle
        run: |
          sed -i -e '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          flutter build appbundle --release --dart-define=SELF_UPDATE=false
          git checkout -- android/app/src/main/AndroidManifest.xml

      - name: Sign Play Store bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          # Remove the debug signature, then sign with the Lumio upload key.
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar "Stamply-${{ github.ref_name }}-play.aab" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "Stamply-${{ github.ref_name }}-play.aab"
          rm "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Stamply-${{ github.ref_name }}.apk
          generate_release_notes: true

      # The Play bundle is kept as a download on the workflow run, not in the public release.
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-store-bundle
          path: Stamply-${{ github.ref_name }}-play.aab
