name: Release

# Runs when you push a tag like v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # Recreate the Lumio release key from repository secrets.
      # Required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      # GitHub APK: includes the in-app "Check for updates".
      # (F-Droid builds the app itself from source, without the updater.)
      - name: Build GitHub APK
        run: flutter build apk --release

      - name: Sign GitHub APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Stamply-${{ github.ref_name }}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "Stamply-${{ github.ref_name }}.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Stamply-${{ github.ref_name }}.apk
          generate_release_notes: true

  # Windows app: a portable zip. Unzip it and run stamply.exe.
  # Needs the windows/ folder in the repo (created once with
  # `flutter create --platforms=windows .`).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Window title and app icon for the .exe
      - name: Brand the Windows app
        shell: bash
        run: |
          sed -i 's/L"stamply"/L"Stamply – Visa Checker"/' windows/runner/main.cpp
          cp tool/windows/app_icon.ico windows/runner/resources/app_icon.ico

      - run: flutter build windows --release

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Stamply-${{ github.ref_name }}-windows.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Stamply-${{ github.ref_name }}-windows.zip
