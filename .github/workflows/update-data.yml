name: Update visa data

# Rebuilds assets/data/visa_data.json from the open Passport Index Data on the
# 1st of every month. The app's "Update data" button downloads this file.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tool/build_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/visa_data.json; then
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visa_data.json
          git commit -m "Update visa data"
          git push
